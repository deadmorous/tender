[pytest]
; importlib mode lets every challenge directory keep the fixed name test.py
; (vibe 000094) without module-name collisions.
addopts = --import-mode=importlib
testpaths = python/tests challenges
; a challenge's runnable file is the fixed name test.py (vibe 000094)
python_files = test_*.py test.py
markers =
    challenge_level(level): certification level this test certifies (L1 or L2)
